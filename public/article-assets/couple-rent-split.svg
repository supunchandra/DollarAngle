<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f1f7f4"/><text x="60" y="100" font-family="Arial" font-size="47" font-weight="bold" fill="#132f2b">Same rent. Different impact.</text><text x="60" y="146" font-family="Arial" font-size="24" fill="#52625d">Illustrative household with $2,400 rent</text><rect x="60" y="196" width="520" height="265" rx="25" fill="#d6efe5"/><rect x="620" y="196" width="520" height="265" rx="25" fill="#dfebf6"/><text x="92" y="262" font-family="Arial" font-size="30" font-weight="bold" fill="#205b49">Equal split</text><text x="652" y="262" font-family="Arial" font-size="30" font-weight="bold" fill="#294d70">Proportional split</text><text x="92" y="355" font-family="Arial" font-size="30" fill="#132f2b">$1,200 + $1,200</text><text x="652" y="355" font-family="Arial" font-size="30" fill="#17334b">$1,600 + $800</text><text x="60" y="520" font-family="Arial" font-size="23" fill="#344e46">Partner A earns $6,000; Partner B earns $3,000 monthly. Neither split is mandatory.</text><text x="60" y="580" font-family="Arial" font-size="19" fill="#586962">DollarAngle  |  Money &amp; Relationships  |  Illustrative</text></svg>