<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Debt cost versus expected investment return</title><desc id="desc">A bar chart comparing credit card APR, personal loan APR and an illustrative long-term stock return assumption.</desc><rect width="1200" height="780" fill="#f8fafc"/><text x="80" y="95" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#0f1720">Why expensive debt often comes before investing</text><text x="80" y="140" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#475569">Illustrative comparison only. Guaranteed debt costs and uncertain market returns are different.</text><g transform="translate(120 660)" font-family="Arial, Helvetica, sans-serif"><line x1="0" y1="0" x2="980" y2="0" stroke="#94a3b8" stroke-width="3"/><line x1="0" y1="0" x2="0" y2="-480" stroke="#94a3b8" stroke-width="3"/><rect x="100" y="-440" width="180" height="440" rx="24" fill="#ef4444"/><text x="155" y="-462" font-size="30" font-weight="700" fill="#0f1720">22%</text><text x="90" y="42" font-size="24" fill="#0f1720">Credit-card APR</text><rect x="420" y="-220" width="180" height="220" rx="24" fill="#f59e0b"/><text x="475" y="-242" font-size="30" font-weight="700" fill="#0f1720">11%</text><text x="417" y="42" font-size="24" fill="#0f1720">Personal-loan APR</text><rect x="740" y="-160" width="180" height="160" rx="24" fill="#10b981"/><text x="797" y="-182" font-size="30" font-weight="700" fill="#0f1720">8%</text><text x="700" y="42" font-size="24" fill="#0f1720">Illustrative stock return</text></g><text x="80" y="735" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#64748b">A high APR is a known cost. Future market returns are uncertain and can be negative for long periods.</text></svg>