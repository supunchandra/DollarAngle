<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Emergency fund roadmap</title>
<desc id="desc">Three stages for building emergency savings: starter buffer, core reserve and risk-adjusted reserve.</desc>
<rect width="1200" height="680" rx="30" fill="#f8fafc"/>
<text x="70" y="88" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#0f1720">Build your emergency fund in layers</text>
<text x="70" y="132" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#64748b">Illustrative milestones, not universal targets.</text>

<rect x="70" y="205" width="310" height="320" rx="28" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
<circle cx="130" cy="265" r="34" fill="#10b981"/>
<text x="119" y="276" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#ffffff">1</text>
<text x="95" y="335" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#0f1720">Starter buffer</text>
<text x="95" y="390" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#334155">Cover one normal</text>
<text x="95" y="425" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#334155">financial surprise</text>
<text x="95" y="460" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#334155">without new debt.</text>

<path d="M400 365 H450" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
<path d="M440 345 L465 365 L440 385" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="475" y="205" width="310" height="320" rx="28" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
<circle cx="535" cy="265" r="34" fill="#334155"/>
<text x="524" y="276" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#ffffff">2</text>
<text x="500" y="335" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#0f1720">Core reserve</text>
<text x="500" y="390" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#334155">Build a larger cushion</text>
<text x="500" y="425" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#334155">around essential</text>
<text x="500" y="460" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#334155">monthly expenses.</text>

<path d="M805 365 H855" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
<path d="M845 345 L870 365 L845 385" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="880" y="205" width="250" height="320" rx="28" fill="#0f1720"/>
<circle cx="940" cy="265" r="34" fill="#10b981"/>
<text x="929" y="276" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#ffffff">3</text>
<text x="905" y="335" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#ffffff">Risk-adjusted</text>
<text x="905" y="373" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#ffffff">reserve</text>
<text x="905" y="425" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#cbd5e1">Expand based on</text>
<text x="905" y="458" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#cbd5e1">income stability,</text>
<text x="905" y="491" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#cbd5e1">dependents and risk.</text>

<text x="70" y="600" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#64748b">The right final target depends on your household, not a single internet rule.</text>
</svg>