<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f1f7f4"/><text x="60" y="100" font-family="Arial" font-size="47" font-weight="bold" fill="#132f2b">A couple's financial freedom roadmap</text><text x="60" y="146" font-family="Arial" font-size="24" fill="#52625d">Work together while preserving autonomy</text><rect x="60" y="196" width="520" height="265" rx="25" fill="#d6efe5"/><rect x="620" y="196" width="520" height="265" rx="25" fill="#dfebf6"/><text x="92" y="262" font-family="Arial" font-size="30" font-weight="bold" fill="#205b49">Build the base</text><text x="652" y="262" font-family="Arial" font-size="30" font-weight="bold" fill="#294d70">Strengthen future</text><text x="92" y="355" font-family="Arial" font-size="30" fill="#132f2b">Budget + emergency cash</text><text x="652" y="355" font-family="Arial" font-size="30" fill="#17334b">Manage debt + invest</text><text x="60" y="520" font-family="Arial" font-size="23" fill="#344e46">Review regularly. Investment outcomes and timelines are never guaranteed.</text><text x="60" y="580" font-family="Arial" font-size="19" fill="#586962">DollarAngle  |  Money &amp; Relationships  |  Illustrative</text></svg>