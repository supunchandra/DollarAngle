<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Financial order of operations ladder</title><desc id="desc">A visual ladder showing eight steps in a financial order of operations.</desc><rect width="1200" height="1500" fill="#f8fafc"/><text x="80" y="110" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#0f1720">Financial order of operations</text><text x="80" y="160" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#475569">Give each new dollar a job, strengthening the foundation first.</text><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></linearGradient></defs><g font-family="Arial, Helvetica, sans-serif"><g fill="url(#g)"><rect x="90" y="1220" width="980" height="110" rx="28"/><rect x="160" y="1090" width="910" height="110" rx="28"/><rect x="230" y="960" width="840" height="110" rx="28"/><rect x="300" y="830" width="770" height="110" rx="28"/><rect x="370" y="700" width="700" height="110" rx="28"/><rect x="440" y="570" width="630" height="110" rx="28"/><rect x="510" y="440" width="560" height="110" rx="28"/><rect x="580" y="310" width="490" height="110" rx="28"/></g><g fill="#fff" font-size="25"><text x="125" y="1284">1  Keep the essentials current</text><text x="195" y="1154">2  Build a starter emergency buffer</text><text x="265" y="1024">3  Capture an employer match</text><text x="335" y="894">4  Pay down expensive consumer debt</text><text x="405" y="764">5  Expand the emergency reserve</text><text x="475" y="634">6  Increase long-term investing</text><text x="545" y="504">7  Fund medium-term goals separately</text><text x="615" y="374">8  Raise your investing rate as income rises</text></g></g></svg>