<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Illustration of how time changes compound growth</title>
<desc id="desc">Hypothetical example showing the future value of investing 200 dollars per month at a constant 7 percent annual return for 10, 20, 30 and 40 years.</desc>
<rect width="1200" height="650" rx="34" fill="#F8FAFC"/>
<text x="70" y="80" fill="#10231D" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">Time changes the scale of compounding</text>
<text x="70" y="122" fill="#64748B" font-family="Arial,Helvetica,sans-serif" font-size="20">Hypothetical: $200 invested monthly, 7% annual return, monthly compounding</text>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="80" y="205" width="210" height="300" rx="24" fill="#FFFFFF" stroke="#DCE5E1" stroke-width="3"/>
<text x="185" y="252" text-anchor="middle" fill="#64748B" font-size="20">10 YEARS</text><text x="185" y="318" text-anchor="middle" fill="#10231D" font-size="34" font-weight="700">$34.6K</text>
<rect x="120" y="375" width="130" height="76" rx="18" fill="#E7F5EF"/><text x="185" y="421" text-anchor="middle" fill="#177A58" font-size="20" font-weight="700">$24K contributed</text>
<rect x="350" y="175" width="210" height="330" rx="24" fill="#FFFFFF" stroke="#DCE5E1" stroke-width="3"/>
<text x="455" y="222" text-anchor="middle" fill="#64748B" font-size="20">20 YEARS</text><text x="455" y="288" text-anchor="middle" fill="#10231D" font-size="34" font-weight="700">$104.2K</text>
<rect x="390" y="375" width="130" height="76" rx="18" fill="#E7F5EF"/><text x="455" y="421" text-anchor="middle" fill="#177A58" font-size="20" font-weight="700">$48K contributed</text>
<rect x="620" y="145" width="210" height="360" rx="24" fill="#FFFFFF" stroke="#DCE5E1" stroke-width="3"/>
<text x="725" y="192" text-anchor="middle" fill="#64748B" font-size="20">30 YEARS</text><text x="725" y="258" text-anchor="middle" fill="#10231D" font-size="34" font-weight="700">$244.0K</text>
<rect x="660" y="375" width="130" height="76" rx="18" fill="#E7F5EF"/><text x="725" y="421" text-anchor="middle" fill="#177A58" font-size="20" font-weight="700">$72K contributed</text>
<rect x="890" y="115" width="230" height="390" rx="24" fill="#FFFFFF" stroke="#DCE5E1" stroke-width="3"/>
<text x="1005" y="162" text-anchor="middle" fill="#64748B" font-size="20">40 YEARS</text><text x="1005" y="228" text-anchor="middle" fill="#10231D" font-size="34" font-weight="700">$525.0K</text>
<rect x="940" y="375" width="130" height="76" rx="18" fill="#E7F5EF"/><text x="1005" y="421" text-anchor="middle" fill="#177A58" font-size="20" font-weight="700">$96K contributed</text>
<text x="70" y="575" fill="#52615C" font-size="19">This is a mathematical illustration, not a forecast. Real returns vary and can be negative.</text>
</g>
</svg>