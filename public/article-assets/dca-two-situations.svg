<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Two situations often called dollar-cost averaging</title>
<desc id="desc">Comparison of investing money as it is earned with deliberately staging an existing lump sum over time.</desc>
<rect width="1200" height="650" rx="34" fill="#F8FAFC"/>
<text x="70" y="82" fill="#10231D" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">Two situations that should not be confused</text>
<text x="70" y="122" fill="#64748B" font-family="Arial,Helvetica,sans-serif" font-size="20">Both use scheduled investing, but the cash-flow tradeoff is different.</text>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="70" y="180" width="500" height="350" rx="28" fill="#FFFFFF" stroke="#DCE5E1" stroke-width="3"/>
<circle cx="135" cy="245" r="34" fill="#DFF3EA"/><text x="135" y="254" text-anchor="middle" fill="#167A58" font-size="27" font-weight="700">1</text>
<text x="195" y="245" fill="#10231D" font-size="26" font-weight="700">Investing as you earn</text>
<text x="110" y="310" fill="#52615C" font-size="21">Paycheck arrives</text><text x="110" y="355" fill="#52615C" font-size="21">Contribution is invested</text><text x="110" y="400" fill="#52615C" font-size="21">Little or no intentional cash delay</text>
<rect x="110" y="455" width="400" height="48" rx="24" fill="#EAF7F1"/><text x="310" y="486" text-anchor="middle" fill="#167A58" font-size="18" font-weight="700">Common in 401(k) contributions</text>
<rect x="630" y="180" width="500" height="350" rx="28" fill="#FFFFFF" stroke="#DCE5E1" stroke-width="3"/>
<circle cx="695" cy="245" r="34" fill="#E8EDF5"/><text x="695" y="254" text-anchor="middle" fill="#425B7A" font-size="27" font-weight="700">2</text>
<text x="755" y="245" fill="#10231D" font-size="26" font-weight="700">Staging an existing lump sum</text>
<text x="670" y="310" fill="#52615C" font-size="21">Cash is already available</text><text x="670" y="355" fill="#52615C" font-size="21">Only part is invested now</text><text x="670" y="400" fill="#52615C" font-size="21">The rest stays in cash temporarily</text>
<rect x="670" y="455" width="400" height="48" rx="24" fill="#EEF2F7"/><text x="870" y="486" text-anchor="middle" fill="#425B7A" font-size="18" font-weight="700">Creates a time-in-market tradeoff</text>
<text x="70" y="590" fill="#6A7873" font-size="18">Research on staged lump sums does not automatically apply to routine paycheck investing.</text>
</g>
</svg>