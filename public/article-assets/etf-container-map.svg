<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">ETF container map</title><desc id="d">Examples of different exposures that ETFs can hold.</desc><rect width="1200" height="680" rx="28" fill="#f8fafc"/><text x="70" y="88" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#0f1720">Same wrapper, very different exposure</text><text x="70" y="132" font-family="Arial,sans-serif" font-size="22" fill="#64748b">An ETF can be broad, narrow, conservative or highly speculative.</text><g font-family="Arial,sans-serif"><rect x="70" y="210" width="250" height="300" rx="28" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><text x="105" y="270" font-size="30" font-weight="700" fill="#065f46">Broad market</text><text x="105" y="330" font-size="22" fill="#334155">Hundreds or</text><text x="105" y="365" font-size="22" fill="#334155">thousands of</text><text x="105" y="400" font-size="22" fill="#334155">securities</text><rect x="350" y="210" width="250" height="300" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/><text x="392" y="270" font-size="30" font-weight="700" fill="#0f1720">Sector ETF</text><text x="392" y="330" font-size="22" fill="#334155">Focused on one</text><text x="392" y="365" font-size="22" fill="#334155">industry or theme</text><rect x="630" y="210" width="250" height="300" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/><text x="682" y="270" font-size="30" font-weight="700" fill="#0f1720">Bond ETF</text><text x="682" y="330" font-size="22" fill="#334155">Government,</text><text x="682" y="365" font-size="22" fill="#334155">corporate or</text><text x="682" y="400" font-size="22" fill="#334155">mixed bonds</text><rect x="910" y="210" width="220" height="300" rx="28" fill="#0f1720"/><text x="948" y="270" font-size="29" font-weight="700" fill="#ffffff">Complex ETF</text><text x="948" y="330" font-size="21" fill="#cbd5e1">Leverage,</text><text x="948" y="365" font-size="21" fill="#cbd5e1">inverse or</text><text x="948" y="400" font-size="21" fill="#cbd5e1">derivatives</text></g><text x="70" y="590" font-family="Arial,sans-serif" font-size="21" fill="#64748b">Before buying, check holdings, concentration, fees, strategy and portfolio overlap.</text></svg>