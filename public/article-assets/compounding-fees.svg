<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Small annual fees can create large long-term differences</title>
<desc id="desc">Illustration based on an Investor.gov example showing approximate ending values after 20 years for a 100,000 dollar portfolio growing 4 percent annually before fees with annual fees of 0.25, 0.50 and 1.00 percent.</desc>
<rect width="1200" height="620" rx="34" fill="#F8FAFC"/>
<text x="70" y="78" fill="#10231D" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">Fees compound too, but in the wrong direction</text>
<text x="70" y="118" fill="#64748B" font-family="Arial,Helvetica,sans-serif" font-size="20">Investor.gov example: $100,000, 4% annual growth before fees, 20 years</text>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="95" y="190" width="280" height="300" rx="26" fill="#FFFFFF" stroke="#DCE5E1" stroke-width="3"/>
<text x="235" y="242" text-anchor="middle" fill="#64748B" font-size="21">0.25% annual fee</text><text x="235" y="320" text-anchor="middle" fill="#177A58" font-size="42" font-weight="700">~$208K</text><text x="235" y="365" text-anchor="middle" fill="#52615C" font-size="18">ending value</text>
<rect x="460" y="190" width="280" height="300" rx="26" fill="#FFFFFF" stroke="#DCE5E1" stroke-width="3"/>
<text x="600" y="242" text-anchor="middle" fill="#64748B" font-size="21">0.50% annual fee</text><text x="600" y="320" text-anchor="middle" fill="#425B7A" font-size="42" font-weight="700">~$198K</text><text x="600" y="365" text-anchor="middle" fill="#52615C" font-size="18">ending value</text>
<rect x="825" y="190" width="280" height="300" rx="26" fill="#FFFFFF" stroke="#DCE5E1" stroke-width="3"/>
<text x="965" y="242" text-anchor="middle" fill="#64748B" font-size="21">1.00% annual fee</text><text x="965" y="320" text-anchor="middle" fill="#8B4B42" font-size="42" font-weight="700">~$179K</text><text x="965" y="365" text-anchor="middle" fill="#52615C" font-size="18">ending value</text>
<text x="70" y="555" fill="#52615C" font-size="19">The investment and return assumptions are hypothetical. Source: Investor.gov, July 2025 bulletin on fees and expenses.</text>
</g>
</svg>