<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="30" fill="#F5F9F7"/><text x="65" y="75" fill="#102B29" font-size="35" font-family="Arial" font-weight="bold">Seven money conversations worth having together</text><text x="65" y="110" fill="#627777" font-size="20" font-family="Arial">Start with understanding, then agree on a practical next step.</text><g font-family="Arial" font-size="21"><rect x="64" y="156" width="510" height="94" rx="18" fill="#FFFFFF" stroke="#D1E7DE"/><circle cx="110" cy="204" r="25" fill="#027B66"/><text x="110" y="212" text-anchor="middle" fill="white">1</text><text x="153" y="196" font-weight="bold" fill="#18342E">Money history</text><text x="153" y="223" font-size="17" fill="#536760">What shaped your habits?</text><rect x="626" y="156" width="510" height="94" rx="18" fill="#FFFFFF" stroke="#D1E7DE"/><circle cx="672" cy="204" r="25" fill="#027B66"/><text x="672" y="212" text-anchor="middle" fill="white">2</text><text x="715" y="196" font-weight="bold" fill="#18342E">Income and cash flow</text><text x="715" y="223" font-size="17" fill="#536760">What comes in and goes out?</text><rect x="64" y="269" width="510" height="94" rx="18" fill="#FFFFFF" stroke="#D1E7DE"/><circle cx="110" cy="317" r="25" fill="#027B66"/><text x="110" y="325" text-anchor="middle" fill="white">3</text><text x="153" y="309" font-weight="bold" fill="#18342E">Debt and obligations</text><text x="153" y="336" font-size="17" fill="#536760">What is already owed?</text><rect x="626" y="269" width="510" height="94" rx="18" fill="#FFFFFF" stroke="#D1E7DE"/><circle cx="672" cy="317" r="25" fill="#027B66"/><text x="672" y="325" text-anchor="middle" fill="white">4</text><text x="715" y="309" font-weight="bold" fill="#18342E">Sharing expenses</text><text x="715" y="336" font-size="17" fill="#536760">What does fair mean to us?</text><rect x="64" y="382" width="510" height="94" rx="18" fill="#FFFFFF" stroke="#D1E7DE"/><circle cx="110" cy="430" r="25" fill="#027B66"/><text x="110" y="438" text-anchor="middle" fill="white">5</text><text x="153" y="422" font-weight="bold" fill="#18342E">Savings and emergencies</text><text x="153" y="449" font-size="17" fill="#536760">What is our safety net?</text><rect x="626" y="382" width="510" height="94" rx="18" fill="#FFFFFF" stroke="#D1E7DE"/><circle cx="672" cy="430" r="25" fill="#027B66"/><text x="672" y="438" text-anchor="middle" fill="white">6</text><text x="715" y="422" font-weight="bold" fill="#18342E">Big life goals</text><text x="715" y="449" font-size="17" fill="#536760">What future are we funding?</text><rect x="64" y="495" width="1072" height="94" rx="18" fill="#DBF0E9"/><circle cx="110" cy="542" r="25" fill="#027B66"/><text x="110" y="550" text-anchor="middle" fill="white">7</text><text x="153" y="535" font-weight="bold" fill="#18342E">Boundaries and regular check-ins</text><text x="153" y="562" font-size="17" fill="#536760">What stays personal, what is shared, and when do we revisit?</text></g></svg>