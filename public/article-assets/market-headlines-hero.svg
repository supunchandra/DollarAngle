<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Market headlines editorial illustration</title><desc id="d">Financial headlines pass through context before becoming a portfolio action.</desc><rect width="1200" height="675" rx="30" fill="#0f1720"/><text x="70" y="88" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#10b981">MARKET HEADLINES</text><text x="70" y="142" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#ffffff">Information is not the same as instruction</text><rect x="70" y="220" width="310" height="330" rx="28" fill="#ffffff"/><text x="110" y="275" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#0f1720">HEADLINES</text><rect x="110" y="320" width="220" height="22" rx="11" fill="#ef4444"/><rect x="110" y="365" width="185" height="22" rx="11" fill="#94a3b8"/><rect x="110" y="410" width="235" height="22" rx="11" fill="#10b981"/><rect x="110" y="455" width="200" height="22" rx="11" fill="#cbd5e1"/><path d="M405 385 H495" stroke="#10b981" stroke-width="10" stroke-linecap="round"/><path d="M475 360 L510 385 L475 410" fill="none" stroke="#10b981" stroke-width="10" stroke-linejoin="round"/><rect x="520" y="220" width="280" height="330" rx="28" fill="#ecfdf5"/><text x="565" y="275" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#065f46">CONTEXT</text><text x="565" y="345" font-family="Arial,sans-serif" font-size="22" fill="#334155">What moved?</text><text x="565" y="395" font-family="Arial,sans-serif" font-size="22" fill="#334155">Why might it matter?</text><text x="565" y="445" font-family="Arial,sans-serif" font-size="22" fill="#334155">Did my facts change?</text><path d="M825 385 H915" stroke="#10b981" stroke-width="10" stroke-linecap="round"/><path d="M895 360 L930 385 L895 410" fill="none" stroke="#10b981" stroke-width="10" stroke-linejoin="round"/><rect x="940" y="220" width="190" height="330" rx="28" fill="#123a32"/><text x="975" y="275" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#ffffff">ACTION</text><circle cx="1035" cy="390" r="82" fill="#10b981"/><text x="982" y="382" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">HIGHER</text><text x="974" y="415" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">THRESHOLD</text><text x="70" y="625" font-family="Arial,sans-serif" font-size="21" fill="#cbd5e1">A headline should pass through your goals, time horizon and portfolio before it becomes a trade.</text></svg>