<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Four bucket interest rate framework</title><desc id="d">How higher rates can affect debt, cash, housing and investments.</desc><rect width="1200" height="700" rx="28" fill="#f8fafc"/><text x="70" y="88" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#0f1720">When rates are higher, check four buckets</text><text x="70" y="132" font-family="Arial,sans-serif" font-size="22" fill="#64748b">These are common effects, not guarantees.</text><g font-family="Arial,sans-serif"><rect x="70" y="210" width="250" height="300" rx="28" fill="#fff" stroke="#ef4444" stroke-width="3"/><text x="110" y="270" font-size="30" font-weight="700" fill="#0f1720">Debt</text><text x="110" y="335" font-size="22" fill="#334155">Variable borrowing</text><text x="110" y="370" font-size="22" fill="#334155">can cost more.</text><rect x="350" y="210" width="250" height="300" rx="28" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><text x="390" y="270" font-size="30" font-weight="700" fill="#065f46">Cash</text><text x="390" y="335" font-size="22" fill="#334155">Savings yields</text><text x="390" y="370" font-size="22" fill="#334155">can improve.</text><rect x="630" y="210" width="250" height="300" rx="28" fill="#fff" stroke="#f59e0b" stroke-width="3"/><text x="670" y="270" font-size="30" font-weight="700" fill="#0f1720">Housing</text><text x="670" y="335" font-size="22" fill="#334155">The same loan</text><text x="670" y="370" font-size="22" fill="#334155">can cost more monthly.</text><rect x="910" y="210" width="220" height="300" rx="28" fill="#0f1720"/><text x="948" y="270" font-size="29" font-weight="700" fill="#ffffff">Investments</text><text x="948" y="335" font-size="21" fill="#cbd5e1">Bond prices and</text><text x="948" y="370" font-size="21" fill="#cbd5e1">valuations can</text><text x="948" y="405" font-size="21" fill="#cbd5e1">reprice.</text></g><text x="70" y="590" font-family="Arial,sans-serif" font-size="20" fill="#64748b">Always ask why rates moved, what markets expected, and which parts of your finances can actually reprice.</text></svg>