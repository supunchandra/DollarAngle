<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Hypothetical employer match example</title><desc id="d">Example of a worker earning sixty thousand dollars with a fifty percent employer match on the first six percent contributed.</desc><rect width="1200" height="650" rx="28" fill="#f8fafc"/><text x="70" y="88" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#0f1720">Hypothetical match math</text><text x="70" y="130" font-family="Arial,sans-serif" font-size="22" fill="#64748b">Salary: $60,000 | Employee saves 6% | Employer matches 50% of that 6%</text><rect x="80" y="220" width="300" height="240" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/><text x="120" y="280" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f1720">Employee</text><text x="120" y="350" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#10b981">$3,600</text><text x="120" y="395" font-family="Arial,sans-serif" font-size="22" fill="#64748b">per year</text><text x="415" y="355" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#64748b">+</text><rect x="485" y="220" width="300" height="240" rx="28" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><text x="525" y="280" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#065f46">Employer</text><text x="525" y="350" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#10b981">$1,800</text><text x="525" y="395" font-family="Arial,sans-serif" font-size="22" fill="#64748b">per year</text><text x="820" y="355" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#64748b">=</text><rect x="890" y="220" width="230" height="240" rx="28" fill="#0f1720"/><text x="930" y="280" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">Total</text><text x="925" y="350" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#10b981">$5,400</text><text x="930" y="395" font-family="Arial,sans-serif" font-size="22" fill="#cbd5e1">per year</text><text x="70" y="555" font-family="Arial,sans-serif" font-size="20" fill="#64748b">Example only. Your employer's formula, contribution limits and vesting rules may be different.</text></svg>