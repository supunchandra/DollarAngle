<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Rent versus buy editorial illustration</title><desc id="d">A split visual comparing renting for flexibility with buying for ownership and control.</desc><rect width="1200" height="675" rx="30" fill="#f8fafc"/><text x="70" y="88" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#10b981">HOUSING DECISION</text><text x="70" y="142" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#0f1720">Rent or buy? Compare the whole system.</text><rect x="70" y="220" width="480" height="350" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/><text x="115" y="285" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#0f1720">RENT</text><rect x="120" y="335" width="185" height="145" rx="18" fill="#e2e8f0"/><rect x="155" y="370" width="48" height="70" fill="#94a3b8"/><rect x="225" y="370" width="48" height="70" fill="#94a3b8"/><path d="M105 335 L210 270 L320 335" fill="none" stroke="#64748b" stroke-width="12" stroke-linejoin="round"/><text x="345" y="360" font-family="Arial,sans-serif" font-size="24" fill="#334155">Flexibility</text><text x="345" y="405" font-family="Arial,sans-serif" font-size="24" fill="#334155">Lower friction</text><text x="345" y="450" font-family="Arial,sans-serif" font-size="24" fill="#334155">More liquidity</text><rect x="650" y="220" width="480" height="350" rx="30" fill="#0f1720"/><text x="695" y="285" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#ffffff">BUY</text><path d="M705 405 L835 300 L965 405" fill="#10b981"/><rect x="742" y="395" width="188" height="120" rx="6" fill="#ecfdf5"/><rect x="815" y="445" width="45" height="70" fill="#0f1720"/><text x="975" y="360" font-family="Arial,sans-serif" font-size="24" fill="#cbd5e1">Control</text><text x="975" y="405" font-family="Arial,sans-serif" font-size="24" fill="#cbd5e1">Equity</text><text x="975" y="450" font-family="Arial,sans-serif" font-size="24" fill="#cbd5e1">More costs</text><text x="70" y="625" font-family="Arial,sans-serif" font-size="21" fill="#64748b">The better choice depends on time horizon, total cost, flexibility and financial resilience.</text></svg>