<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Homeownership cost stack</title><desc id="d">A stacked illustration showing mortgage principal, interest, taxes, insurance, maintenance and transaction costs.</desc><rect width="1200" height="700" rx="30" fill="#f8fafc"/><text x="70" y="88" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#0f1720">The mortgage is not the whole housing cost</text><text x="70" y="130" font-family="Arial,sans-serif" font-size="22" fill="#64748b">A realistic ownership budget includes several layers.</text><g font-family="Arial,sans-serif"><rect x="160" y="520" width="880" height="80" rx="18" fill="#0f1720"/><text x="205" y="570" font-size="26" font-weight="700" fill="#ffffff">Closing, moving and transaction costs</text><rect x="205" y="430" width="790" height="72" rx="18" fill="#334155"/><text x="250" y="476" font-size="25" font-weight="700" fill="#ffffff">Repairs and maintenance</text><rect x="250" y="340" width="700" height="72" rx="18" fill="#64748b"/><text x="295" y="386" font-size="25" font-weight="700" fill="#ffffff">Taxes, insurance and HOA</text><rect x="295" y="250" width="610" height="72" rx="18" fill="#10b981"/><text x="340" y="296" font-size="25" font-weight="700" fill="#ffffff">Mortgage interest</text><rect x="340" y="160" width="520" height="72" rx="18" fill="#d1fae5"/><text x="385" y="206" font-size="25" font-weight="700" fill="#065f46">Mortgage principal</text></g><text x="70" y="650" font-family="Arial,sans-serif" font-size="20" fill="#64748b">Principal can build equity. The other layers still affect affordability and cash flow.</text></svg>