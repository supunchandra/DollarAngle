<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="30" fill="#F8FBFA"/><text x="60" y="68" font-size="35" font-family="Arial" font-weight="bold" fill="#17352E">Equal is not always the same as fair</text><text x="60" y="106" font-family="Arial" font-size="20" fill="#5B716A">Illustration only: shared monthly bills of $2,400 and two different incomes.</text><rect x="55" y="155" width="510" height="275" rx="22" fill="white" stroke="#E0EAE6"/><text x="90" y="198" font-family="Arial" font-size="25" font-weight="bold" fill="#15362F">50/50 split</text><text x="90" y="242" font-family="Arial" font-size="23" fill="#215C4E">Partner A pays $1,200</text><text x="90" y="278" font-family="Arial" font-size="23" fill="#215C4E">Partner B pays $1,200</text><text x="90" y="334" font-family="Arial" font-size="18" fill="#687A75">A earns $6,000; B earns $3,000</text><text x="90" y="380" font-family="Arial" font-size="20" fill="#17352E">A uses 20% of income; B uses 40%</text><rect x="632" y="155" width="510" height="275" rx="22" fill="#E7F6F0" stroke="#BDDCD0"/><text x="670" y="198" font-family="Arial" font-size="25" font-weight="bold" fill="#15362F">Income-proportional split</text><text x="670" y="242" font-family="Arial" font-size="23" fill="#215C4E">Partner A pays $1,600</text><text x="670" y="278" font-family="Arial" font-size="23" fill="#215C4E">Partner B pays $800</text><text x="670" y="334" font-family="Arial" font-size="18" fill="#687A75">A earns two-thirds of combined income</text><text x="670" y="380" font-family="Arial" font-size="20" fill="#17352E">Both use about 26.7% of income</text><text x="60" y="479" font-family="Arial" font-size="19" fill="#53655F">Neither formula is automatically right. Agree on a method both partners can sustain.</text></svg>