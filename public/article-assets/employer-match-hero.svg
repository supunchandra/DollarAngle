ight="260" rx="28" fill="#0f1720"/><text x="985" y="315" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">401(k)</text><path d="M995 455 L1030 410 L1060 430 L1090 355" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>