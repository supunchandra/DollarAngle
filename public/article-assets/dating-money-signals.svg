<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Dating money habits: mismatch versus warning sign</title><desc id="desc">Three comparisons: different budgets versus repeated pressure, past debt versus deception, personal accounts versus demands for financial control.</desc><rect width="1200" height="650" fill="#f4f6f3"/><text x="65" y="87" font-family="Arial,sans-serif" font-size="45" font-weight="bold" fill="#172b27">Dating &amp; money: know the difference</text><text x="65" y="126" font-family="Arial,sans-serif" font-size="22" fill="#52635d">Differences can be negotiated. Pressure and dishonesty deserve attention.</text><rect x="65" y="166" width="510" height="62" rx="15" fill="#d7ebe4"/><rect x="625" y="166" width="510" height="62" rx="15" fill="#fae0d9"/><text x="91" y="208" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#164f40">NORMAL MISMATCH</text><text x="651" y="208" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#9b4134">WARNING SIGN</text><rect x="65" y="247" width="510" height="99" rx="12" fill="#ffffff"/><rect x="625" y="247" width="510" height="99" rx="12" fill="#ffffff"/><text x="88" y="286" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#233a34">Prefers inexpensive dates</text><text x="648" y="286" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#873b31">Shames you for having a budget</text><rect x="65" y="363" width="510" height="99" rx="12" fill="#ffffff"/><rect x="625" y="363" width="510" height="99" rx="12" fill="#ffffff"/><text x="88" y="402" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#233a34">Has debt and explains a plan</text><text x="648" y="402" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#873b31">Hides debts affecting shared decisions</text><rect x="65" y="479" width="510" height="99" rx="12" fill="#ffffff"/><rect x="625" y="479" width="510" height="99" rx="12" fill="#ffffff"/><text x="88" y="518" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#233a34">Keeps a personal bank account</text><text x="648" y="518" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#873b31">Demands your passwords or account access</text><text x="65" y="620" font-family="Arial,sans-serif" font-size="21" fill="#52635d">DollarAngle  |  Money &amp; Relationships</text></svg>