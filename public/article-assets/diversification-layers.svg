<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Three layers of diversification</title>
<desc id="desc">A diagram showing diversification across asset classes, within markets and sectors, and among individual holdings.</desc>
<rect width="1200" height="620" rx="34" fill="#F8FAFC"/>
<text x="70" y="78" fill="#0F1720" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">Diversification happens at more than one level</text>
<text x="70" y="116" fill="#64748B" font-family="Arial,Helvetica,sans-serif" font-size="19">Different tickers help only when they actually spread the sources of risk.</text>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="70" y="175" width="1060" height="115" rx="22" fill="#0F1720"/>
<circle cx="135" cy="232" r="30" fill="#10B981"/>
<text x="135" y="240" text-anchor="middle" fill="#0F1720" font-size="22" font-weight="700">1</text>
<text x="195" y="220" fill="#F8FAFC" font-size="24" font-weight="700">Across asset classes</text>
<text x="195" y="253" fill="#CBD5E1" font-size="18">Stocks • bonds • cash • other assets appropriate to the goal</text>
<rect x="70" y="315" width="1060" height="115" rx="22" fill="#E2E8F0"/>
<circle cx="135" cy="372" r="30" fill="#10B981"/>
<text x="135" y="380" text-anchor="middle" fill="#0F1720" font-size="22" font-weight="700">2</text>
<text x="195" y="360" fill="#0F1720" font-size="24" font-weight="700">Within markets and sectors</text>
<text x="195" y="393" fill="#475569" font-size="18">Different industries • regions • company sizes • bond types</text>
<rect x="70" y="455" width="1060" height="115" rx="22" fill="#ECFDF5" stroke="#A7F3D0"/>
<circle cx="135" cy="512" r="30" fill="#10B981"/>
<text x="135" y="520" text-anchor="middle" fill="#0F1720" font-size="22" font-weight="700">3</text>
<text x="195" y="500" fill="#0F1720" font-size="24" font-weight="700">Among individual holdings</text>
<text x="195" y="533" fill="#475569" font-size="18">Avoid letting one company or theme determine the whole portfolio outcome</text>
</g>
</svg>