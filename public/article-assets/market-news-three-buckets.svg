<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Three market news buckets</title><desc id="d">Market stories divided into noise, useful information and actionable personal change.</desc><rect width="1200" height="680" rx="30" fill="#f8fafc"/><text x="70" y="88" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#0f1720">Three buckets for market news</text><text x="70" y="130" font-family="Arial,sans-serif" font-size="22" fill="#64748b">Not every headline deserves a portfolio decision.</text><g font-family="Arial,sans-serif"><rect x="70" y="210" width="310" height="330" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/><circle cx="125" cy="270" r="34" fill="#94a3b8"/><text x="114" y="281" font-size="30" font-weight="700" fill="#ffffff">1</text><text x="95" y="340" font-size="31" font-weight="700" fill="#0f1720">Noise</text><text x="95" y="400" font-size="22" fill="#334155">Short-term movement</text><text x="95" y="438" font-size="22" fill="#334155">with little effect on</text><text x="95" y="476" font-size="22" fill="#334155">your long-term plan.</text><rect x="445" y="210" width="310" height="330" rx="28" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><circle cx="500" cy="270" r="34" fill="#10b981"/><text x="489" y="281" font-size="30" font-weight="700" fill="#ffffff">2</text><text x="470" y="340" font-size="31" font-weight="700" fill="#065f46">Information</text><text x="470" y="400" font-size="22" fill="#334155">New facts that can</text><text x="470" y="438" font-size="22" fill="#334155">change valuations</text><text x="470" y="476" font-size="22" fill="#334155">or risk.</text><rect x="820" y="210" width="310" height="330" rx="28" fill="#0f1720"/><circle cx="875" cy="270" r="34" fill="#10b981"/><text x="864" y="281" font-size="30" font-weight="700" fill="#ffffff">3</text><text x="845" y="340" font-size="29" font-weight="700" fill="#ffffff">Personal change</text><text x="845" y="400" font-size="21" fill="#cbd5e1">Your goals, cash,</text><text x="845" y="436" font-size="21" fill="#cbd5e1">time horizon or risk</text><text x="845" y="472" font-size="21" fill="#cbd5e1">capacity changed.</text></g><text x="70" y="610" font-family="Arial,sans-serif" font-size="20" fill="#64748b">Portfolio action usually deserves a higher bar than simply seeing a dramatic headline.</text></svg>