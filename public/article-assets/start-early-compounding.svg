<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Starting early matters for compounding</title><desc id="desc">A bar chart comparing the future value at age 65 of investing 500 dollars a month starting at age 25 versus age 35, assuming a 7 percent annual return.</desc><rect width="1200" height="780" fill="#f8fafc"/><text x="80" y="95" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#0f1720">Starting early changes the compounding math</text><text x="80" y="140" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#475569">Illustration: $500 per month, 7% annual return, values shown at age 65.</text><g transform="translate(130 640)" font-family="Arial, Helvetica, sans-serif"><line x1="0" y1="0" x2="940" y2="0" stroke="#94a3b8" stroke-width="3"/><line x1="0" y1="0" x2="0" y2="-500" stroke="#94a3b8" stroke-width="3"/><rect x="150" y="-497" width="220" height="497" rx="24" fill="#10b981"/><text x="181" y="-520" font-size="32" font-weight="700" fill="#0f1720">$1.31M</text><text x="163" y="40" font-size="28" fill="#0f1720">Start at age 25</text><rect x="560" y="-231" width="220" height="231" rx="24" fill="#0f1720"/><text x="602" y="-254" font-size="32" font-weight="700" fill="#0f1720">$610k</text><text x="573" y="40" font-size="28" fill="#0f1720">Start at age 35</text></g><text x="80" y="735" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#64748b">This is a mathematical illustration, not a forecast. Real returns vary and investment losses are possible.</text></svg>